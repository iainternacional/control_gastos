<style>
  :root {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --texto: #1d2733;
    --suave: #5f6b7a;
    --borde: #dde3ea;
    --primario: #2e7d32;
    --primario-oscuro: #1b5e20;
    --primario-claro: #e8f5e9;
    --error: #c62828;
    --error-claro: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--texto);
    font-size: 15px;
  }
  header {
    background: var(--primario);
    color: #fff;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 5;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; white-space: nowrap; }
  nav { display: flex; gap: 4px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    color: #d7ecd8;
    text-decoration: none;
    padding: 0 14px;
    min-height: 40px;
    display: inline-flex;
    align-items: center;
    border-radius: 6px;
    font-size: 14px;
    white-space: nowrap;
  }
  nav a:hover { background: rgba(255,255,255,.12); color: #fff; }
  nav a.activo { background: #fff; color: var(--primario); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  h2 { font-size: 20px; margin: 0 0 16px; }
  h3 { font-size: 16px; margin: 0 0 12px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 18px;
  }
  .panel.angosto { max-width: 760px; margin-left: auto; margin-right: auto; }
  .rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .dos-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px) { .dos-col { grid-template-columns: 1fr; } }
  .tarjeta {
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .tarjeta .etiqueta { color: var(--suave); font-size: 13px; }
  .tarjeta .valor { font-size: 22px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tarjeta.destacada { background: var(--primario-claro); border-color: #c5e1c7; }
  .negativo, .over { color: var(--error); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 4px; }
  .campo { margin-bottom: 12px; }
  .fila-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  input, select {
    width: 100%;
    padding: 9px 10px;
    min-height: 40px;
    border: 1px solid var(--borde);
    border-radius: 6px;
    font-size: 15px;
    background: #fff;
    color: var(--texto);
  }
  input:focus, select:focus { outline: 2px solid #a5d6a7; border-color: var(--primario); }
  button.btn {
    background: var(--primario);
    color: #fff;
    border: 0;
    padding: 10px 18px;
    min-height: 42px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn:active { background: var(--primario-oscuro); }
  button.btn:disabled { background: #999; cursor: wait; }
  button.btn.secundario { background: #fff; color: var(--primario); border: 1px solid var(--primario); }
  button.btn.secundario:disabled { background: #fff; color: #bbb; border-color: #ccc; cursor: default; }
  button.btn.ancho { width: 100%; }
  button.icono {
    border: 0;
    background: none;
    font-size: 16px;
    cursor: pointer;
    padding: 6px 8px;
    line-height: 1;
    border-radius: 6px;
  }
  button.icono:hover { background: #f0f2f5; }
  button.icono.editar, button.icono.guardar { color: var(--primario); }
  button.icono.eliminar, button.icono.cancelar { color: var(--error); }
  button.icono:disabled { color: #ccc; cursor: default; }
  .periodo-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .periodo-nav .periodo { font-size: 16px; font-weight: 600; min-width: 140px; text-align: center; }
  .tabla-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--borde); text-align: left; }
  th { color: var(--suave); font-weight: 600; font-size: 13px; background: #fafbfc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.acc { text-align: right; white-space: nowrap; width: 1%; }
  td input, td select { min-height: 34px; padding: 5px 8px; font-size: 14px; }
  .ayuda { font-size: 13px; color: var(--suave); margin: 4px 0 0; }
  .vacio { color: var(--suave); text-align: center; padding: 18px; }
  .extra { text-align: center; font-size: 15px; margin-bottom: 18px; }
  #msg { text-align: center; font-size: 14px; min-height: 20px; margin-top: 10px; }
  #msg.ok { color: var(--primario); }
  #msg.error { color: var(--error); }
  .grafico { width: 100%; height: 300px; }
  .lista-presupuesto { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .item-presupuesto {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .item-presupuesto .nombre { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  .item-presupuesto input { width: 130px; text-align: right; }
  .lista-categorias { list-style: none; margin: 0; padding: 0; }
  .lista-categorias li {
    padding: 8px 4px;
    border-bottom: 1px solid var(--borde);
  }
  .lista-categorias li:last-child { border-bottom: 0; }
  .fila-cat, .fila-sub { display: flex; align-items: center; gap: 8px; }
  .fila-sub { padding: 2px 0; font-size: 14px; color: var(--suave); }
  .nombre { flex: 1; overflow-wrap: anywhere; }
  .subs { margin: 6px 0 4px 14px; padding-left: 10px; border-left: 2px solid var(--borde); }
  .lista-subs { list-style: none; margin: 0; padding: 0; }
  .subs .agregar { margin-top: 6px; }
  .subs .agregar input { min-height: 34px; font-size: 14px; }
  .subs .agregar button { min-height: 34px; padding: 6px 12px; font-size: 13px; }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; }
  .desplegable {
    border: 1px solid var(--borde);
    border-radius: 6px;
    background: #fff;
    position: relative;
  }
  .desplegable summary { min-height: 40px; padding: 9px 10px; cursor: pointer; list-style-position: inside; }
  .lista-checks {
    border-top: 1px solid var(--borde);
    max-height: 220px;
    overflow-y: auto;
    padding: 6px 10px;
  }
  .lista-checks label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--texto); margin: 0; padding: 6px 0; cursor: pointer; }
  .lista-checks input { width: auto; min-height: 0; }
  .agregar { display: flex; gap: 8px; margin-top: 12px; }
  .agregar input { flex: 1; }
  @media (max-width: 640px) {
    main { padding: 14px 12px 60px; }
    header { flex-wrap: wrap; gap: 6px; }
    header h1 { font-size: 16px; }
    nav { flex: 1 1 100%; }
    .grafico { height: 260px; }
    table.tabla-tarjetas thead { display: none; }
    table.tabla-tarjetas, table.tabla-tarjetas tbody { display: block; }
    table.tabla-tarjetas tr {
      display: block;
      border: 1px solid var(--borde);
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 4px 10px;
      background: #fff;
    }
    table.tabla-tarjetas td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 0;
      padding: 5px 0;
      text-align: right;
      width: auto;
    }
    table.tabla-tarjetas td[data-label]::before {
      content: attr(data-label);
      color: var(--suave);
      font-size: 13px;
      text-align: left;
      flex: none;
    }
    table.tabla-tarjetas td input,
    table.tabla-tarjetas td select { flex: 1; min-width: 0; }
    table.tabla-tarjetas td.acc { justify-content: flex-end; }
    .item-presupuesto input { width: 110px; }
  }
</style>
