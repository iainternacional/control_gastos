<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <?!= include('Stylesheet') ?>
</head>
<body>
  <header>
    <h1>Control de Gastos</h1>
    <nav>
      <a href="<?= appUrl ?>?page=form<?= authSuffix ?>" class="activo">Gasto</a>
      <a href="<?= appUrl ?>?page=ingreso<?= authSuffix ?>">Ingreso</a>
      <a href="<?= appUrl ?>?page=resumen<?= authSuffix ?>">Resumen</a>
      <a href="<?= appUrl ?>?page=historial<?= authSuffix ?>">Movimientos</a>
      <a href="<?= appUrl ?>?page=categorias<?= authSuffix ?>">Categorías</a>
      <a href="<?= appUrl ?>?page=presupuesto<?= authSuffix ?>">Presupuesto</a>
      <a href="<?= appUrl ?>?page=proyecciones<?= authSuffix ?>">Proyecciones</a>
    </nav>
  </header>

  <main>
    <div class="panel angosto">
      <h2>Registrar gasto</h2>
      <form id="form">
        <div class="fila-campos">
          <div class="campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
          </div>
          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" required></select>
          </div>
          <div class="campo" id="subcategoriaBox" style="display:none;">
            <label for="subcategoria">Subcategoría (opcional)</label>
            <select id="subcategoria"></select>
          </div>
          <div class="campo">
            <label for="monto">Monto</label>
            <input type="number" id="monto" min="0" step="0.01" placeholder="0" required>
          </div>
        </div>
        <div id="nuevaCategoriaBox" style="display:none;">
          <div class="campo">
            <label for="nuevaCategoriaInput">Nombre de la categoría nueva</label>
            <input type="text" id="nuevaCategoriaInput" placeholder="Ej: Mascotas">
          </div>
          <div class="campo">
            <button type="button" class="btn secundario" id="btnGuardarCategoria">Agregar categoría</button>
          </div>
        </div>
        <div class="campo">
          <label for="descripcion">Descripción</label>
          <input type="text" id="descripcion" placeholder="Ej: Mercado del mes" required>
        </div>
        <button type="submit" class="btn ancho" id="submitBtn">Guardar gasto</button>
        <div id="msg"></div>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('fecha').valueAsDate = new Date();

    const OPCION_NUEVA = '__nueva__';

    function agregarOpcionCategoria(select, cat) {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.insertBefore(opt, document.getElementById('opcionNuevaCategoria'));
      return opt;
    }

    let subcategorias = {};

    function actualizarSubcategorias() {
      const categoria = document.getElementById('categoria').value;
      const subs = (subcategorias[categoria] || []).slice().sort(function(a, b) {
        return a.localeCompare(b, 'es', { sensitivity: 'base' });
      });
      const select = document.getElementById('subcategoria');
      select.innerHTML = '';
      const ninguna = document.createElement('option');
      ninguna.value = '';
      ninguna.textContent = 'Sin subcategoría';
      select.appendChild(ninguna);
      subs.forEach(function(sub) {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.textContent = sub;
        select.appendChild(opt);
      });
      document.getElementById('subcategoriaBox').style.display = subs.length ? 'block' : 'none';
    }

    google.script.run.withSuccessHandler(function(categorias) {
      const select = document.getElementById('categoria');
      categorias.forEach(function(cat) {
        agregarOpcionCategoria(select, cat);
      });
      const opcionNueva = document.createElement('option');
      opcionNueva.id = 'opcionNuevaCategoria';
      opcionNueva.value = OPCION_NUEVA;
      opcionNueva.textContent = '+ Agregar categoría nueva';
      select.appendChild(opcionNueva);

      google.script.run.withSuccessHandler(function(mapa) {
        subcategorias = mapa;
        actualizarSubcategorias();
      }).getSubcategoriasTodas();
    }).getCategorias();

    document.getElementById('categoria').addEventListener('change', function() {
      const box = document.getElementById('nuevaCategoriaBox');
      if (this.value === OPCION_NUEVA) {
        box.style.display = 'block';
        document.getElementById('nuevaCategoriaInput').focus();
      } else {
        box.style.display = 'none';
      }
      actualizarSubcategorias();
    });

    document.getElementById('btnGuardarCategoria').addEventListener('click', function() {
      const input = document.getElementById('nuevaCategoriaInput');
      const btn = this;
      const msg = document.getElementById('msg');
      const nombre = input.value.trim();

      if (!nombre) {
        msg.textContent = 'Escribe un nombre para la categoría';
        msg.className = 'error';
        return;
      }

      btn.disabled = true;
      msg.textContent = '';
      msg.className = '';

      google.script.run
        .withSuccessHandler(function(resultado) {
          const select = document.getElementById('categoria');
          const opt = agregarOpcionCategoria(select, resultado.categoria);
          select.value = opt.value;
          actualizarSubcategorias();
          document.getElementById('nuevaCategoriaBox').style.display = 'none';
          input.value = '';
          btn.disabled = false;
          msg.textContent = 'Categoría agregada ✓';
          msg.className = 'ok';
        })
        .withFailureHandler(function(err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'error';
          btn.disabled = false;
        })
        .addCategoria(nombre);
    });

    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      const categoria = document.getElementById('categoria').value;

      if (categoria === OPCION_NUEVA) {
        msg.textContent = 'Primero agrega la categoría nueva o elige otra';
        msg.className = 'error';
        return;
      }

      btn.disabled = true;
      msg.textContent = '';
      msg.className = '';

      const fecha = document.getElementById('fecha').value;
      const descripcion = document.getElementById('descripcion').value;
      const monto = document.getElementById('monto').value;
      const subcategoria = document.getElementById('subcategoria').value;

      google.script.run
        .withSuccessHandler(function() {
          msg.textContent = 'Gasto guardado ✓';
          msg.className = 'ok';
          btn.disabled = false;
          document.getElementById('descripcion').value = '';
          document.getElementById('monto').value = '';
          document.getElementById('subcategoria').value = '';
        })
        .withFailureHandler(function(err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'error';
          btn.disabled = false;
        })
        .addExpense(fecha, categoria, descripcion, monto, subcategoria);
    });
  </script>
</body>
</html>
