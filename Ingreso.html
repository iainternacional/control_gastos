<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }
    h1 { font-size: 20px; margin: 0 0 20px; text-align: center; }
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 420px;
      margin: 0 auto;
    }
    label { font-size: 14px; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: white;
    }
    button {
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      color: white;
      background: #2e7d32;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:active { background: #1b5e20; }
    button:disabled { background: #999; }
    #msg { text-align: center; font-size: 14px; min-height: 20px; }
    #msg.ok { color: #2e7d32; }
    #msg.error { color: #c62828; }
    nav { text-align: center; margin-top: 16px; }
    nav a { color: #2e7d32; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Registrar ingreso</h1>
  <form id="form">
    <div>
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" required>
    </div>
    <div>
      <label for="categoria">Categoría</label>
      <select id="categoria" required></select>
    </div>
    <div id="nuevaCategoriaBox" style="display:none;">
      <label for="nuevaCategoriaInput">Nombre de la categoría nueva</label>
      <input type="text" id="nuevaCategoriaInput" placeholder="Ej: Bono">
      <button type="button" id="btnGuardarCategoria">Agregar categoría</button>
    </div>
    <div>
      <label for="descripcion">Descripción</label>
      <input type="text" id="descripcion" placeholder="Ej: Quincena de septiembre" required>
    </div>
    <div>
      <label for="monto">Monto</label>
      <input type="number" id="monto" min="0" step="0.01" placeholder="0" required>
    </div>
    <button type="submit" id="submitBtn">Guardar ingreso</button>
    <div id="msg"></div>
  </form>
  <nav>
    <a href="<?= appUrl ?>?page=form<?= authSuffix ?>">Registrar un gasto</a> ·
    <a href="<?= appUrl ?>?page=resumen<?= authSuffix ?>">Ver resumen del mes</a> ·
    <a href="<?= appUrl ?>?page=historial<?= authSuffix ?>">Ver/eliminar movimientos</a> ·
    <a href="<?= appUrl ?>?page=categorias<?= authSuffix ?>">Gestionar categorías</a> ·
    <a href="<?= appUrl ?>?page=presupuesto<?= authSuffix ?>">Editar presupuesto</a>
  </nav>

  <script>
    document.getElementById('fecha').valueAsDate = new Date();

    const OPCION_NUEVA = '__nueva__';

    function agregarOpcionCategoria(select, cat) {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.insertBefore(opt, document.getElementById('opcionNuevaCategoria'));
      return opt;
    }

    google.script.run.withSuccessHandler(function(categorias) {
      const select = document.getElementById('categoria');
      categorias.forEach(function(cat) {
        agregarOpcionCategoria(select, cat);
      });
      const opcionNueva = document.createElement('option');
      opcionNueva.id = 'opcionNuevaCategoria';
      opcionNueva.value = OPCION_NUEVA;
      opcionNueva.textContent = '+ Agregar categoría nueva';
      select.appendChild(opcionNueva);
    }).getCategoriasIngresos();

    document.getElementById('categoria').addEventListener('change', function() {
      const box = document.getElementById('nuevaCategoriaBox');
      if (this.value === OPCION_NUEVA) {
        box.style.display = 'block';
        document.getElementById('nuevaCategoriaInput').focus();
      } else {
        box.style.display = 'none';
      }
    });

    document.getElementById('btnGuardarCategoria').addEventListener('click', function() {
      const input = document.getElementById('nuevaCategoriaInput');
      const btn = this;
      const msg = document.getElementById('msg');
      const nombre = input.value.trim();

      if (!nombre) {
        msg.textContent = 'Escribe un nombre para la categoría';
        msg.className = 'error';
        return;
      }

      btn.disabled = true;
      msg.textContent = '';
      msg.className = '';

      google.script.run
        .withSuccessHandler(function(resultado) {
          const select = document.getElementById('categoria');
          const opt = agregarOpcionCategoria(select, resultado.categoria);
          select.value = opt.value;
          document.getElementById('nuevaCategoriaBox').style.display = 'none';
          input.value = '';
          btn.disabled = false;
          msg.textContent = 'Categoría agregada ✓';
          msg.className = 'ok';
        })
        .withFailureHandler(function(err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'error';
          btn.disabled = false;
        })
        .addCategoriaIngreso(nombre);
    });

    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');
      const categoria = document.getElementById('categoria').value;

      if (categoria === OPCION_NUEVA) {
        msg.textContent = 'Primero agrega la categoría nueva o elige otra';
        msg.className = 'error';
        return;
      }

      btn.disabled = true;
      msg.textContent = '';
      msg.className = '';

      const fecha = document.getElementById('fecha').value;
      const descripcion = document.getElementById('descripcion').value;
      const monto = document.getElementById('monto').value;

      google.script.run
        .withSuccessHandler(function() {
          msg.textContent = 'Ingreso guardado ✓';
          msg.className = 'ok';
          btn.disabled = false;
          document.getElementById('descripcion').value = '';
          document.getElementById('monto').value = '';
        })
        .withFailureHandler(function(err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'error';
          btn.disabled = false;
        })
        .addIngreso(fecha, categoria, descripcion, monto);
    });
  </script>
</body>
</html>
